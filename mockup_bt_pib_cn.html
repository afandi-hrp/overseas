<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BT Gabungan PIB CN</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--plum:#5b2a4e;--ink:#2b1a26;--mute:#8a7d86;--line:#eee4e0;--ok-bg:#e6f6ec;--ok:#1d7a45;--warn-bg:#fff1cc;--warn:#8a5d00;--bad-bg:#fde6e6;--bad:#b42323;--info-bg:#e8efff;--info:#2c4a9a}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);font-size:13px;background:linear-gradient(135deg,#fde9c9,#fbd3bf 55%,#f6b9a4);min-height:100vh}
.wrap{max-width:1450px;margin:0 auto;padding:16px}
h1{margin:0;font-size:19px}.sub{color:var(--mute);font-size:11.5px}
.seg{display:inline-flex;background:#fff;border-radius:9px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font:inherit;font-weight:700;cursor:pointer;color:var(--mute);font-size:12px}
.seg button.on{background:var(--plum);color:#fff}
.box{background:#fff;border-radius:14px;margin-top:12px;border:1px solid var(--line)}
.grp{display:grid;grid-template-columns:120px 1fr}
.gl{background:#faf6f4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:800;color:var(--plum);font-size:11px;border-radius:14px 0 0 14px}
table.g{border-collapse:collapse;width:100%}
table.g th{font-size:10.5px;font-weight:800;padding:11px 8px;letter-spacing:.4px}
table.g td{padding:12px 8px;border-top:1px solid #f0e8e5;border-left:1px solid #f0e8e5;text-align:center;vertical-align:middle;font-size:12.5px}
table.g td.f{text-align:left;font-weight:700;border-left:0;width:150px}
td.bt{position:relative;background:#fffaf2;min-width:230px}
.chip{display:inline-block;font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap;margin-top:4px}
.c-ok{background:var(--ok-bg);color:var(--ok)}.c-bad{background:var(--bad-bg);color:var(--bad)}.c-warn{background:var(--warn-bg);color:var(--warn)}.c-info{background:var(--info-bg);color:var(--info)}
.sm{display:block;font-size:10.5px;color:var(--mute)}
.big{font-weight:800;font-size:14px}
.tg{border:0;background:none;color:var(--plum);font:inherit;font-weight:700;font-size:11px;cursor:pointer;padding:0;margin-top:6px;display:block;margin-left:auto;margin-right:auto}
.rp{position:absolute;right:6px;top:calc(100% - 8px);width:360px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(60,20,40,.18);padding:10px 12px;z-index:30;text-align:left;font-size:11.5px}
.rp.inl{position:static;width:auto;box-shadow:none;margin-top:8px;background:#fcf9fb}
.ln{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.ok{color:var(--ok)}.wr{color:var(--warn)}.bd{color:var(--bad)}
.rp table{width:100%;border-collapse:collapse;margin-top:6px}
table.g .rp td,.rp td{padding:4px 2px;border:0;border-top:1px dashed var(--line);font-size:11px;text-align:left}
table.g .rp td.r,.rp td.r{text-align:right}
.rp .oth td{color:#ab9fa7}
.btn{border:1px solid var(--plum);background:var(--plum);color:#fff;border-radius:7px;padding:4px 10px;font:inherit;font-weight:700;font-size:11px;cursor:pointer;margin-top:8px}
.lrow{display:grid;grid-template-columns:190px 1fr;border-top:1px solid var(--line)}
.lrow .fl{padding:12px 16px;font-weight:700}
.ents{padding:8px 10px 8px 0}
.ent{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:6px;display:grid;grid-template-columns:120px 1fr auto;gap:8px;align-items:center}
.ent.bt{background:#fffaf2}
.src{font-size:11px;font-weight:700}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.umf{border:1px solid #f3c4c4;background:#fff8f8;border-left:3px solid #b42323;border-radius:10px;padding:9px 12px;margin-top:8px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.umf.w{border-color:#f1d38a;border-left-color:#d9a441;background:#fffaf0}
.bo{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;padding:5px 12px;font:inherit;font-weight:700;font-size:11.5px;cursor:pointer}
.note{background:#fff;border-left:3px solid var(--plum);border-radius:8px;padding:10px 12px;margin-top:12px;font-size:12px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="h1"></h1>
  <div class="sub" id="h2"></div>
  <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap">
    <div class="seg" id="segJ"><button class="on" data-j="pib">PIB · Wellston (JPY)</button><button data-j="cn">CN · FEDEX 877210070429 (USD)</button></div>
    <div class="seg" id="segS"><button class="on" data-s="now">Sekarang</button><button data-s="rin">Sesudah · ada Rincian BT</button><button data-s="rem">Sesudah · tanpa Rincian (pakai Payment Remarks)</button><button data-s="err">Rincian ≠ BT (salah ketik)</button></div>
    <div class="seg" id="segM"><button class="on" data-m="cols">Columns</button><button data-m="list">List</button></div>
  </div>
  <div class="box" id="body"></div>
  <div class="note" id="note"></div>
  <div class="box" style="padding:12px 16px"><div style="font-size:11px;font-weight:800;color:var(--plum);letter-spacing:.3px">INVOICE RECAP · TAB DOC VALIDATION · NOTIFIKASI DEPAN</div><div id="front"></div></div>
</div>
<script>
const f=n=>n.toLocaleString('id-ID');
const CASES={pib:{h1:'BT Vendor gabungan · jalur PIB · Wellston Trading',h2:'BT JPY 661.956 untuk 9 invoice · AWB ini 2 invoice · ACUAN = nilai invoice di PIB (Reference 290.000) · toleransi ≤ 0,5',CIPL:{'00001732':72000,'00001731':218000},BT:661956,RIN:null,REM:null},
 cn:{h1:'BT Vendor gabungan · jalur CN · FEDEX 877210070429',h2:'BT USD 191 untuk 2 invoice · AWB ini 1 invoice (PL260910PTDE) · ACUAN = total Final Invoice USD 77 · toleransi ≤ 0,5',CIPL:{'PL260910PTDE':77},BT:191,
  RIN:[['2608/0053/IMI','PL260813PTDE',114],['2609/0036/IMI','PL260910PTDE',77]],REM:[['','PL260813PTDE',114],['','PL260910PTDE',77]]}};
let J='pib';let CIPL,BT,RIN,REM;
const RIN_P=[['2604/0224/IMI','00001456',72000],['2605/0087/IMI','00001457',40000],['2606/0056/IMI','00001458',30000],['2606/0057/IMI','00001459',30000],['2606/0073/IMI','00001460',40616],['2607/0006/IMI','00001464',26840],['2607/0009/IMI','00001461',132500],['2607/0203/IMI','00001732',72000],['2607/0146/IMI (1) - PARTIAL','00001731',218000]];
const REM_P=RIN_P.slice(0,8);CASES.pib.RIN=RIN_P;CASES.pib.REM=REM_P;
function setJ(){const c=CASES[J];CIPL=c.CIPL;BT=c.BT;RIN=c.RIN;REM=c.REM;h1.textContent=c.h1;h2.textContent=c.h2;}setJ();
let SC='now',MO='cols',OPEN=false,OTH=false;
const T=0.5,eq=(a,b)=>Math.abs(a-b)<=T;
function rinErr(){if(J==='cn')return RIN.map(x=>x[1]==='PL260813PTDE'?[x[0],x[1],104]:x);return RIN.map(x=>x[1]==='00001457'?[x[0],x[1],4000]:x)}
function calc(){
 const src=SC==='rem'?REM:SC==='err'?rinErr():RIN;const sum=src.reduce((a,x)=>a+x[2],0);
 const found=Object.keys(CIPL).map(k=>{const l=src.find(x=>x[1]===k);return{inv:k,cipl:CIPL[k],bt:l?l[2]:null}});
 const nF=found.filter(x=>x.bt!==null).length,diffs=found.filter(x=>x.bt!==null&&!eq(x.bt,x.cipl));
 const porsi=found.reduce((a,x)=>a+(x.bt||0),0);
 const NI=Object.keys(CIPL).length;const trunc=REM.reduce((a,x)=>a+x[2],0)<BT;
 const rinBad=SC!=='rem'&&!eq(sum,BT);
 // per invoice rincian vs remarks (only if remarks complete)
 const rvr=SC==='rem'?null:(trunc?'skip':src.filter(x=>{const r=REM.find(y=>y[1]===x[1]);return !r||!eq(r[2],x[2])}));
 const st=rinBad?'bad':nF<NI?'warn':diffs.length?'bad':'ok';
 return{src,sum,found,nF,diffs,porsi,st,rinBad,rvr,trunc,oth:src.filter(x=>!CIPL[x[1]])};
}
function pop(c,inl){
 const ic=v=>v===true?'<span class="ok">✓</span>':v===false?'<span class="bd">✕</span>':'<span class="wr">!</span>';
 let h=`<b>Rincian BT</b> <span class="sub">· ${SC==='rem'?(J==='cn'?'Payment Remarks (lengkap)':'Payment Remarks (terpotong)'):'Rincian BT Vendor'}</span>
 <div class="ln"><span>${ic(SC==='rem'&&c.sum<BT?null:!c.rinBad&&eq(c.sum,BT))} Total rincian = BT</span><b>${SC==='rem'&&c.sum<BT?'remarks terpotong':f(c.sum)+' / '+f(BT)}</b></div>
 ${SC==='rem'?'':`<div class="ln"><span>${ic(c.rvr==='skip'?null:!c.rvr.length)} Rincian = Payment Remarks</span><b>${c.rvr==='skip'?'dilewati (remarks terpotong)':c.rvr.length?c.rvr.map(x=>x[1]).join(', ')+' beda':'semua sama'}</b></div>`}
 <div class="ln"><span>${ic(c.nF===Object.keys(CIPL).length?true:null)} Invoice AWB ini ditemukan</span><b>${c.nF}/${Object.keys(CIPL).length}</b></div>
 <div class="ln"><span>${ic(!c.diffs.length)} Nilai per invoice = ${J==="pib"?"acuan PIB":"Final Invoice"}</span><b>${c.diffs.length?c.diffs.length+' beda':'semua sama'}</b></div><table>`;
 c.found.forEach(x=>h+=`<tr><td>${x.inv}</td><td class="r">${x.bt===null?'–':f(x.bt)}</td><td class="r">${x.bt===null?'<span class="wr">tidak ada</span>':x.bt!==x.cipl?'<span class="bd">beda</span>':'<span class="ok">✓</span>'}</td></tr>`);
 h+=`<tr><td colspan="3"><button class="tg" style="margin:0" id="tgo">${OTH?'▾':'▸'} ${c.oth.length} invoice shipment lain</button></td></tr>`;
 if(OTH)c.oth.forEach(x=>h+=`<tr class="oth"><td>${x[1]}</td><td class="r">${f(x[2])}</td><td class="r">diabaikan</td></tr>`);
 h+='</table>'+(c.st==='warn'?'<button class="btn">⇪ Upload rincian BT</button>':'');
 return `<div class="rp ${inl?'inl':''}" onclick="event.stopPropagation()">${h}</div>`;
}
function render(){
 const P=J==='pib',NI=Object.keys(CIPL).length,ACU=Object.values(CIPL).reduce((a,b)=>a+b,0),invs=Object.keys(CIPL).join(' +<br>');
 const ok='<span class="chip c-ok">✓ Match</span>',mm='<span class="chip c-bad">⊗ Mismatch</span>';
 let iv,ivs,ni,nis,c=null;
 if(SC==='now'){iv=`${f(BT)}<span class="sm">(acuan ${f(ACU)})</span>`;ivs=mm+'<br><button class="btn" style="background:#fff;color:var(--ok);border-color:#bfe3cb">Accept</button>';ni=RIN.map(x=>x[1]).join(' +<br>');nis=mm;}
 else{c=calc();window._c=c;
  const stc=c.st==='ok'?ok:c.st==='bad'?mm:'<span class="chip c-warn">◷ Perlu rincian BT</span>';
  const trunc=SC==='rem'&&c.sum!==BT;
  iv=`<span class="big">${f(c.porsi)}</span><span class="sm">porsi AWB ini · Total BT ${f(BT)}</span><span class="chip c-info">Gabungan · ${c.nF}/${NI} invoice dari ${c.src.length}${trunc?'+':''} di BT</span><br>`;
  ivs=stc+`<button class="tg" id="tg">${OPEN?'▾ Tutup rincian':'▸ Rincian BT'}</button>`+(OPEN&&MO==='cols'?pop(c):'');
  ni=c.found.map(x=>`${x.inv} ${x.bt===null?'<span class="wr">✕</span>':'<span class="ok">✓</span>'}`).join('<br>')+`<span class="sm">+${c.oth.length} invoice shipment lain (diabaikan)</span>`;
  nis=c.nF<NI?'<span class="chip c-warn">◷ Perlu rincian BT</span>':ok;}
 const grpN=P?'PIB':'CIPL (CN PATH ONLY)',f1=P?'Item Value':'Total Item Value',f2=P?'No Invoice Vendor':'No. Invoice';
 const poCell=P?`340.000<span class="sm"><i>Other cost: -50.000</i></span>${mm}<span class="sm">→ fitur PO partial</span>`:`77<span class="sm">(77)</span>${ok}`;
 const mmCount=SC==='now'?(P?3:2):(P?1:0)+(c&&c.st!=='ok'?0:0);
 const gchip=SC==='now'?`<span class="chip c-bad">${mmCount} mismatch</span>`:(c.st==='ok'?(P?'<span class="chip c-bad">1 mismatch</span><span class="sm" style="text-align:center">(sisa: PO partial)</span>':`<span class="chip c-ok">3/3 match</span>`):(c.st==='bad'?`<span class="chip c-bad">${P?2:1} mismatch</span>`:`<span class="chip c-warn">perlu rincian BT</span>`));
 if(MO==='cols'){
  const cols=P?['PO','CIPL','FINAL INVOICE','BT VENDOR']:['PO','FINAL INVOICE','BT VENDOR'];
  const bg={'PO':'#fff3a6','CIPL':'#c9e9ff','FINAL INVOICE':'#ead9ff','BT VENDOR':'#ffd9e2'};
  const r1=P?`<td>${poCell}</td><td>${f(ACU)}<br>${ok}</td><td>${f(ACU)}<br>${ok}</td>`:`<td>${poCell}</td><td>${f(ACU)}<span class="sm">(${f(ACU)})</span>${ok}</td>`;
  const r2=P?`<td>–</td><td>${invs}<br>${ok}</td><td>${invs}<br>${ok}</td>`:`<td>–</td><td>${invs}<span class="sm">(${invs})</span>${ok}</td>`;
  body.innerHTML=`<div class="grp"><div class="gl">${grpN}${gchip}</div>
  <table class="g"><tr><th style="background:#f2f4f8;text-align:left">FIELD</th>${cols.map(k=>`<th style="background:${bg[k]}">${k}</th>`).join('')}</tr>
  <tr><td class="f">${f1}</td>${r1}<td class="bt">${iv}${ivs}</td></tr>
  <tr><td class="f">${f2}</td>${r2}<td class="bt">${ni}<br>${nis}</td></tr></table></div>`;
 }else{
  const e=(s2,col,v,st,bt)=>`<div class="ent ${bt?'bt':''}"><span class="src"><span class="dot" style="background:${col}"></span>${s2}</span><div>${v}</div><div style="text-align:right">${st}</div></div>`;
  const ivTxt=SC==='now'?iv:iv.replace('<br>','');
  const ivSt=SC==='now'?mm:ivs.replace(/<div class="rp[\s\S]*$/,'');
  const invL=Object.keys(CIPL).join(' + ');
  body.innerHTML=`<div style="padding:12px 16px;background:#faf6f4;border-radius:14px 14px 0 0"><b>${P?'PIB':'CIPL (CN path only)'}</b><div class="sub">${P?'The PIB values must match every related document':'CIPL vs PO, final invoice & BT vendor'}</div></div>
  <div class="lrow"><div class="fl">${f1}<div class="sub">Reference: <b>${f(ACU)}</b></div></div><div class="ents">${e('PO','#8a5d00',P?'340.000 <span class="sub"><i>Other cost -50.000 → fitur PO partial</i></span>':'77',P?mm:ok)}${P?e('CIPL','#2c6aa0',f(ACU),ok):''}${e('Final Invoice','#7e3aa8',f(ACU),ok)}${e('BT Vendor','#a1234a',ivTxt+(OPEN&&SC!=='now'?pop(c,true):''),ivSt,1)}</div></div>
  <div class="lrow"><div class="fl">${f2}<div class="sub">Reference: <b>${invL}</b></div></div><div class="ents">${P?e('CIPL','#2c6aa0',invL,ok):''}${e('Final Invoice','#7e3aa8',invL,ok)}${e('BT Vendor','#a1234a',ni,nis,1)}</div></div>`;
 }
 const N=P?{now:'<b>Sekarang:</b> Amount BT 661.956 dan semua invoice di BT dibandingkan langsung ke acuan PIB 290.000 → Mismatch.',
  rin:'<b>Sesudah (ada rincian):</b> hanya 00001732 (72.000) + 00001731 (218.000) yang ada di CIPL → porsi 290.000 = acuan PIB → Match. 7 invoice lain diabaikan.',
  rem:'<b>Sesudah (tanpa rincian):</b> Payment Remarks terpotong ("+"), 00001731 tidak terbaca → porsi 72.000 → "Perlu rincian BT" + Upload rincian BT.',
  err:'<b>Rincian ≠ BT (contoh buatan):</b> 00001457 di rincian tertulis 4.000 (seharusnya 40.000) → total rincian 625.956 ≠ BT 661.956 → Mismatch "Rincian ≠ BT", walau porsi AWB ini (290.000) sama. Cek per invoice vs Payment Remarks dilewati karena remarks terpotong.'}
 :{now:'<b>Sekarang:</b> Amount BT 191 dan 2 invoice di BT dibandingkan langsung ke Final Invoice 77 → Total Item Value & No. Invoice Mismatch.',
  rin:'<b>Sesudah (ada rincian):</b> hanya PL260910PTDE (77) yang ada di Final Invoice → porsi 77 = acuan → Match. PL260813PTDE (114) milik shipment lain, diabaikan.',
  rem:'<b>Sesudah (tanpa rincian):</b> Payment Remarks LENGKAP (114 + 77 = 191 = Amount BT, tanpa "+") → tetap Match walau rincian tidak diupload.',
  err:'<b>Rincian ≠ BT (contoh buatan):</b> PL260813PTDE di rincian tertulis 104 (seharusnya 114) → total rincian 181 ≠ BT 191 → Mismatch "Rincian ≠ BT", walau porsi AWB ini (77) sama. Cek per invoice vs Payment Remarks juga menandai PL260813PTDE.'};
 note.innerHTML=N[SC];
 const fld=P?'Item Value':'Total Item Value',grp=P?'PIB':'CIPL (CN path only)',fld2=P?'No Invoice Vendor':'No. Invoice';
 let fh='';
 if(SC==='now'){fh=`<div class="umf"><div><b>${fld}</b><div class="sub">${grp} · BT Vendor</div><div>${f(ACU)} (${f(BT)})</div></div><div style="text-align:right"><b style="color:#b42323;font-size:11.5px">Mismatch</b><br><button class="bo" style="margin-top:8px">Accept</button></div></div>
  <div class="umf"><div><b>${fld2}</b><div class="sub">${grp} · BT Vendor</div><div>${Object.keys(CIPL).join(' + ')} (${RIN.map(x=>x[1]).join(' + ')})</div></div><div style="text-align:right"><b style="color:#b42323;font-size:11.5px">Mismatch</b><br><button class="bo" style="margin-top:8px">Accept</button></div></div>`;}
 else if(c.st==='ok')fh='<div style="margin-top:8px;border:1px solid #bfe3cb;background:#f2fbf5;border-radius:9px;padding:9px 12px;font-size:12px;color:var(--ok);font-weight:600">BT Vendor Match → tidak tampil di Unmatched fields.</div>';
 else{const w=c.st==='warn';const miss=c.found.filter(x=>x.bt===null).map(x=>x.inv);
  const why=c.rinBad?`Total rincian ${f(c.sum)} ≠ Amount BT ${f(BT)}`:w?`${c.nF}/${NI} invoice ditemukan (${miss.join(', ')} tidak ada)`:`selisih ${f(c.porsi-ACU)}`;
  fh=`<div class="umf ${w?'w':''}"><div><b>${fld}</b><div class="sub">${grp} · BT Vendor</div><div>Porsi BT <b>${f(c.porsi)}</b> / Acuan <b>${f(ACU)}</b> · Gabungan ${c.nF}/${NI} invoice dari ${c.src.length}${w?'+':''} di BT</div><div class="sub" style="color:${w?'var(--warn)':'var(--bad)'}">${c.rinBad?'Rincian ≠ BT · ':''}${why}</div></div>
  <div style="text-align:right"><b style="color:${w?'var(--warn)':'#b42323'};font-size:11.5px">${w?'Perlu rincian BT':'Mismatch'}</b><br><div style="display:flex;gap:6px;margin-top:8px">${w?'<button class="btn" style="margin:0">⇪ Upload rincian BT</button>':''}<button class="bo">Accept</button></div></div></div>`;
  if(w)fh+=`<div class="umf w"><div><b>${fld2}</b><div class="sub">${grp} · BT Vendor</div><div>${c.found.map(x=>x.inv+(x.bt===null?' ✕':' ✓')).join(' + ')}</div></div><div style="text-align:right"><b style="color:var(--warn);font-size:11.5px">Perlu rincian BT</b></div></div>`;}
 const n=SC==='now'?2:c.st==='ok'?0:c.st==='warn'?2:1;
 front.innerHTML=`<div style="margin-top:6px"><b>Unmatched fields <span style="color:#b42323">(${n})</span></b> <span class="sub">· hanya kartu BT Vendor (contoh)</span></div>`+fh;
}
document.addEventListener('click',e=>{if(e.target.id==='tg'){OPEN=!OPEN;render()}else if(e.target.id==='tgo'){OTH=!OTH;render()}else if(OPEN&&!e.target.closest('.rp')&&!e.target.closest('.seg')){OPEN=false;render()}});
segS.querySelectorAll('button').forEach(b=>b.onclick=()=>{segS.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');SC=b.dataset.s;OPEN=false;render()});
segM.querySelectorAll('button').forEach(b=>b.onclick=()=>{segM.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');MO=b.dataset.m;render()});
segJ.querySelectorAll('button').forEach(b=>b.onclick=()=>{segJ.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');J=b.dataset.j;setJ();OPEN=false;OTH=false;render()});
render();
</script>
</body>
</html>
