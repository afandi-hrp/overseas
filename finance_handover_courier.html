<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance Handover – Courier</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbefe4; --card:#fffaf5; --card-paid:#f1f8f2; --line:#efe3d8; --ink:#2b1b2a; --muted:#7a6b72;
  --plum:#5b2a4e; --plum-ink:#fff; --plum-soft:#f3e8ef;
  --green:#1f7a4d; --green-soft:#e3f4e9; --red:#b42318; --red-soft:#fdecea;
  --orange:#b45309; --orange-soft:#fdf1e2; --blue:#1d5fbf; --blue-soft:#e6efff; --gray-soft:#efebe7;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(120deg,#fde9d6 0%,#fbd9c4 60%,#f7b9a0 100%);min-height:100vh}
.wrap{max-width:1440px;margin:0 auto;padding:20px 16px 40px}
h1{margin:0;font-size:26px;font-weight:800}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}
.kpi{background:#fff;border-radius:14px;padding:14px 16px;border:2px solid transparent;cursor:pointer;text-align:left;font:inherit;color:inherit}
.kpi.on{border-color:var(--plum)}
.kpi .l{font-size:12px;color:var(--muted)} .kpi .n{font-size:22px;font-weight:800;margin-right:8px}
.kpi .a{font-size:13px;font-weight:700}
.bar{background:#fff;border-radius:14px;padding:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:flex;background:var(--gray-soft);border-radius:10px;padding:3px}
.seg button{border:0;background:none;font:inherit;font-weight:700;font-size:13px;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--plum);color:#fff}
.seg button[disabled]{opacity:.45;cursor:not-allowed}
.search{flex:1 1 260px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:13px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.card.paid{background:var(--card-paid)}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:14px 16px}
.c-left{flex:1 1 220px;min-width:0}
.c-pay{flex:1 1 240px;min-width:0}
.c-amt{flex:0 0 190px;text-align:right}
.c-tl{flex:1 1 300px}
.c-act{flex:0 0 auto;display:flex;gap:8px;align-items:center}
.chip{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;margin-right:4px}
.chip.cour{background:#fde7c2;color:#7a4a00}.chip.pt{background:var(--plum);color:#fff}
.chip.cn{background:#efe5ff;color:#5b2a9e}.chip.pib{background:#e3eefc;color:#1d4f9b}
.lbl{font-size:10px;letter-spacing:.08em;color:var(--muted);font-weight:700;text-transform:uppercase;margin-top:6px}
.awb{font-size:17px;font-weight:800}
.small{font-size:12px;color:var(--muted)}
.pay{font-weight:800;font-size:14px}
.amt{font-size:18px;font-weight:800}
.due{font-size:12px;font-weight:600}
.due.paid{color:var(--green)}
.tl{display:flex;align-items:flex-start}
.step{flex:1;position:relative;font-size:12px}
.step .dot{width:11px;height:11px;border-radius:50%;background:#d6cdd2;position:relative;z-index:1}
.step.done .dot{background:var(--green)}
.step:not(:last-child)::after{content:"";position:absolute;top:5px;left:11px;right:0;height:2px;background:#e2d9de}
.step.done.next-done::after{background:var(--green)}
.step b{display:block;margin-top:6px}
.step span{color:var(--muted);font-size:11px}
.btn{font:inherit;font-weight:700;font-size:13px;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid transparent;min-height:40px}
.btn.pri{background:var(--plum);color:#fff}
.btn.pri:hover{background:#4a1f3f}
.btn.out{background:#fff;border-color:#d8c9d2;color:var(--plum)}
.btn.out.on{background:var(--plum-soft)}
.status{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
.st-w{background:var(--orange-soft);color:var(--orange)}
.st-r{background:var(--blue-soft);color:var(--blue)}
.st-p{background:var(--green-soft);color:var(--green)}
.detail{border-top:1px solid var(--line);padding:6px 16px 18px;background:#fffdfb}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap;align-items:center}
.tabs button{border:0;background:none;font:inherit;font-weight:600;font-size:13px;color:var(--muted);padding:12px 0;cursor:pointer;border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center}
.tabs button.on{color:var(--ink);border-bottom-color:var(--plum)}
.tabs .ro{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);background:var(--gray-soft);padding:3px 8px;border-radius:6px}
.tdot{width:7px;height:7px;border-radius:50%}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 10px;background:#f7f1ec}
td{padding:9px 10px;border-top:1px solid #f1e8e1}
td.r,th.r{text-align:right}
tr.tot td{font-weight:800;background:#faf5f0}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;overflow-x:auto}
.box h3{margin:0 0 10px;font-size:14px}
.badge{font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;white-space:nowrap}
.b-ok{background:var(--green-soft);color:var(--green)}
.b-bad{background:var(--red-soft);color:var(--red)}
.b-na{background:var(--gray-soft);color:var(--muted)}
.chk{display:flex;gap:14px;flex-wrap:wrap}
.chk-sum{flex:0 0 280px}
.chk-grid{flex:1 1 400px}
.prog{height:8px;border-radius:6px;background:#eee4dd;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:#d99a1c}
.miss{background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px;font-size:12px;font-weight:700;margin-top:10px}
.docs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.doc{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.doc.ok{background:#eef8f1;border-color:#cbe8d4;color:#165c3a}
.doc.no{background:#fdf0ee;border-color:#f3c9c2;color:var(--red)}
.doc.opt{background:#fff;color:var(--muted)}
.note{background:#f8f4f0;border-radius:10px;padding:10px 12px;font-size:13px;white-space:pre-line}
.empty{padding:30px;text-align:center;color:var(--muted);background:#fff;border-radius:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.shead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.shead .tt{flex:1 1 240px;min-width:0}
.shead .tt b{font-size:15px}
.stat{min-width:84px;text-align:center;border-radius:10px;padding:8px 10px}
.stat .v{font-size:20px;font-weight:800;line-height:1.1}
.stat .k{font-size:11px;font-weight:700}
.s-ok{background:var(--green-soft);color:var(--green)}
.s-bad{background:var(--red-soft);color:var(--red)}
.s-na{background:var(--gray-soft);color:var(--muted)}
.accw{flex:0 1 190px;min-width:150px}
.accw .top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.accw .top b{color:var(--ink)}
.accw .prog{margin:6px 0 0}
.pbtn{display:inline-flex;gap:6px;align-items:center;border:1px solid #d8c9d2;background:#fff;color:var(--ink);font:inherit;font-weight:700;font-size:12px;border-radius:9px;padding:7px 12px;cursor:pointer}
.ponly{display:none}
@media print{
  body{background:#fff}
  body.printing .wrap>*:not(.list){display:none!important}
  body.printing .card:not(.print-me){display:none!important}
  body.printing .card{border:0;background:#fff}
  body.printing .btn,body.printing .pbtn,body.printing .ro,body.printing .tabs button:not(.on),body.printing .toast{display:none!important}
  body.printing .ponly{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}
  .box,.shead{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.c-amt{text-align:left;flex:1 1 100%}.docs{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Finance Handover</h1>
  <div class="sub">Tab Courier: 1 card per AWB. Klik <b>Open</b> untuk melihat detail (view-only). Klik <b>Accept</b> / <b>Mark paid</b> untuk mencoba alur status. Data contoh.</div>
  <div class="kpis" id="kpis"></div>
  <div class="bar">
    <div class="seg">
      <button disabled title="Belum ada perubahan">All sources</button>
      <button disabled title="Belum ada perubahan">FAR Overseas</button>
      <button disabled title="Belum ada perubahan">Sea &amp; Air</button>
      <button class="on">Courier</button>
    </div>
    <input class="search" id="q" placeholder="Search AWB, invoice, vendor, PT" aria-label="Search">
  </div>
  <div class="list" id="list"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const REQ=["Invoice Freight","FP Invoice Freight","Invoice Duty","FP Invoice Duty","SPPBMCP","Billing DJBC","BPN","PO (Ascend)","CIPL","AWB","Final Invoice","BT Vendor"];
const OPT=["Credit Note Freight","FP Revisi Freight","Credit Note Duty","FP Revisi Duty","BT Vendor Details","SPTNP","Billing DJBC SPTNP","BPN SPTNP"];

const data=[
 {id:1,courier:"DHL",pt:"IMI",awb:"DHL NO. 4417338109",jalur:"CN",vendor:"HD HYUNDAI MARINE SOLUTION SINGAPORE PTE LTD",payable:"DHL Express Indonesia",
  sent:"22 Sep 2026",due:"22 Oct 2026",top:"30d",status:"w",
  inv:[{t:"Invoice Freight",no:"MESIR00022494",email:"16 Sep 2026",amt:1275990},
       {t:"Invoice Duty",no:"MESZR00005217",email:"29 Sep 2026",amt:26820318},
       {t:"Credit Note Freight",no:"MESCN00001183",email:"02 Oct 2026",amt:-289000,cn:true}],
  missing:["FP Invoice Freight","Final Invoice","BT Vendor"],optHave:["Credit Note Freight"],
  costF:[["Freight Charge",1180500,1180500],["Fuel Surcharge (46%)",543030,543030],["VAT (1.1%)",18959,18959]],
  costD:[["DUTY & TAX",26618118,26618118],["Disbursement",150000,150000],["Processing Fee",50000,50000],["VAT Duty (1.1%)",2200,2200]],
  note:"-",
  docInv:[["No. AWB","Invoice Freight · Invoice Duty","DHL NO. 4417338109","m"],["Subtotal","Invoice Freight · FP","1.256.020","m"],["DPP","Invoice Duty · FP Duty","26.668.118","m"],["PPN","Invoice Duty · FP Duty","2.200","m"],["No. Invoice","Credit Note Freight","MESIR00022494","n"]],
  sppb:[["Total Nilai Pabean vs CIF Penetapan","BPN DHL / HTBK","213,89","m"]],
  npwp:[["No. NPWP","SPPBMCP","0923605109121000","m"],["No. NPWP","Billing DJBC","0923605109121000","m"],["No. NPWP","BPN","0923605109121000","m"]]},
 {id:2,courier:"FEDEX",pt:"IMI",awb:"FEDEX NO. 876685429528",jalur:"PIB",vendor:"WELLSTON TRADING CORPORATION",payable:"FedEx Express Indonesia",
  sent:"25 Sep 2026",recv:"30 Sep 2026",due:"25 Oct 2026",top:"30d",status:"r",
  inv:[{t:"Invoice Freight",no:"872991369",email:"20 Sep 2026",amt:1301467},
       {t:"Invoice Duty",no:"872991370",email:"24 Sep 2026",amt:4267243}],
  missing:[],optHave:[],
  costF:[["Freight Charge",860717,860717],["Fuel Surcharge (46%)",395930,405590],["DEMAND SURCHARGE",0,21000],["VAT (1.1%)",13823,14160]],
  costD:[["DUTY & TAX",4065043,4065043],["Disbursement",150000,150000],["Processing Fee",50000,50000],["VAT Duty (1.1%)",2200,2200]],
  note:"- INVOICE FREIGHT OVERCHARGE Rp 30.997 VALID KARENA ADA DEMAND SURCHARGE Rp 21.000. FUEL SURCHARGE (46%) DIHITUNG DARI FREIGHT + DEMAND SURCHARGE (+Rp 9.660), VAT 1,1% IKUT NAIK (+Rp 337).",
  docInv:[["No. AWB","Invoice Freight · Invoice Duty","FEDEX NO. 876685429528","m"],["Subtotal","Invoice Freight · FP","1.287.307","m"],["DPP","Invoice Duty · FP Duty","4.265.043","m"],["PPN","Invoice Duty · FP Duty","2.200","m"]],
  sppb:[],
  npwp:[["No. NPWP","PIB","0923605109121000","m"],["No. NPWP","Billing DJBC","0923605109121000","m"]]},
 {id:3,courier:"FEDEX",pt:"WNS",awb:"FEDEX NO. 876921941357",jalur:"CN",vendor:"HYUNDAI MARINE TECH CO., LTD",payable:"FedEx Express Indonesia",
  sent:"25 Sep 2026",recv:"26 Sep 2026",paid:"28 Sep 2026",due:"25 Oct 2026",top:"30d",status:"p",
  inv:[{t:"Invoice Duty",no:"872991356",email:"23 Sep 2026",amt:744702}],
  missing:[],optHave:[],
  costF:[],
  costD:[["DUTY & TAX",542502,542502],["Disbursement",150000,150000],["Processing Fee",50000,50000],["VAT Duty (1.1%)",2200,2200]],
  note:"-",
  docInv:[["No. AWB","Invoice Duty","FEDEX NO. 876921941357","m"],["DPP","Invoice Duty · FP Duty","742.502","m"]],
  sppb:[["Total Nilai Pabean vs CIF Penetapan","BPN FEDEX","96,40","m"]],
  npwp:[["No. NPWP","SPPBMCP","0213908100121000","m"],["No. NPWP","BPN","0213908100121000","n"]]},
 {id:4,courier:"DHL",pt:"GMI",awb:"DHL NO. 6858351220",jalur:"CN",vendor:"KONGSBERG MARITIME PTE LTD",payable:"DHL Express Indonesia",
  sent:"02 Oct 2026",due:"01 Nov 2026",top:"30d",status:"w",
  inv:[{t:"Invoice Freight",no:"MESIR00022811",email:"30 Sep 2026",amt:2104550},
       {t:"Invoice Duty",no:"MESZR00005402",email:"01 Oct 2026",amt:3118900},
       {t:"Credit Note Duty",no:"MESCN00001201",email:"03 Oct 2026",amt:-150000,cn:true}],
  missing:["BT Vendor"],optHave:["Credit Note Duty"],
  costF:[["Freight Charge",1418500,1418500],["Fuel Surcharge (46%)",652510,652510],["VAT (1.1%)",22780,33540]],
  costD:[["DUTY & TAX",2916700,2916700],["Disbursement",150000,150000],["Processing Fee",50000,50000],["VAT Duty (1.1%)",2200,2200]],
  note:"-",
  docInv:[["No. AWB","Invoice Freight · Invoice Duty","DHL NO. 6858351220","m"],["Subtotal","Invoice Freight · FP","2.071.010","x"],["DPP","Invoice Duty · FP Duty","3.116.700","m"]],
  sppb:[["Total Nilai Pabean vs CIF Penetapan","BPN DHL / HTBK","182,10","m"]],
  npwp:[["No. NPWP","SPPBMCP","0812233409121000","m"],["No. NPWP","Billing DJBC","0812233409121000","m"]]}
];

const state={filter:"all",open:null,tab:{},q:""};
const rp=n=>"Rp "+Math.abs(n).toLocaleString("id-ID");
const acc=n=>n<0?"("+Math.abs(n).toLocaleString("id-ID")+")":rp(n);
const total=c=>c.inv.reduce((s,i)=>s+i.amt,0);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const chkPct=c=>Math.round((REQ.length-c.missing.length)/REQ.length*100);
const costRows=rows=>rows.map(([l,e,a])=>{const d=a-e;return{l,e,a,d,st:d===0?"OK":d>0?"OVERCHARGE":"UNDERCHARGE"}});
const costPct=c=>{const r=costRows([...c.costF,...c.costD]);return r.length?Math.round(r.filter(x=>x.st==="OK").length/r.length*100):null};
const docAll=c=>[...c.docInv,...(c.jalur==="CN"?c.sppb:[]),...c.npwp];
const docPct=c=>{const r=docAll(c).filter(x=>x[3]!=="n");return r.length?Math.round(r.filter(x=>x[3]==="m").length/r.length*100):null};
const dotColor=p=>p===null?"#c9c0c5":p===100?"var(--green)":"#d97706";
const STL={w:["Waiting for Finance","st-w"],r:["Received · unpaid","st-r"],p:["Paid","st-p"]};

function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove("show"),1800)}

function renderKpis(){
  const g=k=>data.filter(c=>k==="all"||c.status===k);
  const items=[["w","Waiting for Finance","Accept untuk konfirmasi dokumen diterima"],["r","Received · unpaid","Mark paid setelah transfer"],["p","Paid","Transfer tercatat"],["all","All handovers (Courier)","Per AWB"]];
  document.getElementById("kpis").innerHTML=items.map(([k,l,s])=>{const L=g(k);const sum=L.reduce((a,c)=>a+total(c),0);
    return `<button class="kpi ${state.filter===k?"on":""}" data-f="${k}"><div class="l">${l}</div><div><span class="n">${L.length}</span><span class="a">${rp(sum)}</span></div><div class="small">${s}</div></button>`}).join("");
}

function tlStep(label,date,done,nextDone){return `<div class="step ${done?"done":""} ${nextDone?"next-done":""}"><div class="dot"></div><b>${label}</b><span>${date||"Pending"}</span></div>`}

function statHead(title,sub,stats,accTxt,pct){
  return `<div class="shead"><div class="tt"><b>${title}</b><div class="small">${sub}</div></div>`+
    stats.map(([v,k,cl])=>`<div class="stat ${cl}"><div class="v">${v}</div><div class="k">${k}</div></div>`).join("")+
    `<div class="accw"><div class="top"><span>Accuracy</span><b>${accTxt}</b></div><div class="prog"><i style="width:${pct||0}%;background:${pct===100?"var(--green)":"#d99a1c"}"></i></div></div></div>`;
}
const TABNAME={inv:"Invoices",chk:"Checklist",cost:"Cost Validation",doc:"Doc Validation"};
function detailHtml(c){
  const tab=state.tab[c.id]||"inv";
  const cp=chkPct(c),co=costPct(c),dp=docPct(c);
  const tabs=[["inv","Invoices",null],["chk",`Checklist ${cp}%`,cp],["cost",`Cost Validation ${co===null?"–":co+"%"}`,co],["doc",`Doc Validation ${dp===null?"–":dp+"%"}`,dp]];
  let body="";
  if(tab==="inv"){
    body=`<div class="box"><table><thead><tr><th>Jenis · No. Invoice</th><th>Tanggal terima email</th><th class="r">Jumlah</th></tr></thead><tbody>`+
    c.inv.map(i=>`<tr><td><b>${esc(i.t)}</b> · ${esc(i.no)}</td><td>${i.email}</td><td class="r">${acc(i.amt)}</td></tr>`).join("")+
    `<tr class="tot"><td colspan="2" class="r">Total (bersih)</td><td class="r">${rp(total(c))}</td></tr></tbody></table></div>`;
  }else if(tab==="chk"){
    const have=REQ.length-c.missing.length;
    const optHave=c.optHave.length;
    body=statHead("Checklist",`${have} of ${REQ.length} required documents · ${cp}% lengkap`,
      [[have,"Lengkap","s-ok"],[c.missing.length,"Kurang","s-bad"],[optHave,"Opsional ada","s-na"]],`${have}/${REQ.length}`,cp)+
    `<div class="chk"><div class="chk-sum box"><h3>Checklist <span class="badge ${cp===100?"b-ok":"b-bad"}">${cp===100?"Complete":"Incomplete"}</span></h3>
      <div style="font-size:26px;font-weight:800">${cp}%</div><div class="prog"><i style="width:${cp}%;background:${cp===100?"var(--green)":"#d99a1c"}"></i></div>
      <div class="small">${have} of ${REQ.length} required documents</div>
      ${c.missing.length?`<div class="miss">Missing: ${c.missing.join(", ")}</div>`:`<div class="miss" style="background:var(--green-soft);color:var(--green)">Semua dokumen wajib lengkap</div>`}
      <div class="lbl" style="margin-top:12px">Catatan Checklist</div><div class="note">-</div></div>
      <div class="chk-grid box"><div class="lbl" style="margin:0 0 8px">Required ${have}/${REQ.length}</div><div class="docs">`+
      REQ.map(d=>{const ok=!c.missing.includes(d);return `<div class="doc ${ok?"ok":"no"}">${ok?"✓":"✕"} ${d}</div>`}).join("")+
      `</div><div class="lbl" style="margin:0 0 8px">Optional ${c.optHave.length}/${OPT.length}</div><div class="docs">`+
      OPT.map(d=>{const ok=c.optHave.includes(d);return `<div class="doc ${ok?"ok":"opt"}">${ok?"✓":"○"} ${d}</div>`}).join("")+`</div></div></div>`;
  }else if(tab==="cost"){
    const tbl=(title,rows)=>{const r=costRows(rows);if(!r.length)return `<div class="box"><h3>${title}</h3><div class="small">Tidak ada invoice untuk bagian ini.</div></div>`;
      const te=r.reduce((s,x)=>s+x.e,0),ta=r.reduce((s,x)=>s+x.a,0),td=ta-te;
      return `<div class="box"><h3>${title}</h3><table><thead><tr><th>Validasi</th><th class="r">Expected</th><th class="r">Actual</th><th class="r">Selisih</th><th>Status</th></tr></thead><tbody>`+
      r.map(x=>`<tr><td>${x.l}</td><td class="r">${rp(x.e)}</td><td class="r"><b>${rp(x.a)}</b></td><td class="r">${rp(x.d)}</td><td><span class="badge ${x.st==="OK"?"b-ok":"b-bad"}">${x.st}</span></td></tr>`).join("")+
      `<tr class="tot"><td>TOTAL</td><td class="r">${rp(te)}</td><td class="r">${rp(ta)}</td><td class="r">${rp(td)}</td><td><span class="badge ${td===0?"b-ok":"b-bad"}">${td===0?"OK":td>0?"OVERCHARGE":"UNDERCHARGE"}</span></td></tr></tbody></table></div>`};
    const all=costRows([...c.costF,...c.costD]);
    const ok=all.filter(x=>x.st==="OK").length,diff=all.length-ok;
    const secs=[c.costF,c.costD].filter(r=>r.length);
    const secOk=secs.filter(r=>costRows(r).every(x=>x.d===0)).length;
    const na=2-secs.length;
    body=statHead("Cost validation",`${secOk} of ${secs.length} invoices match the rate sheet`,
      [[ok,"OK","s-ok"],[diff,"Difference","s-bad"],[na,"N/A","s-na"]],`${co===null?"–":co+"%"}`,co)+
      tbl("Invoice Freight Validation",c.costF)+tbl("Invoice Duty Validation",c.costD)+
      `<div class="box"><div class="lbl" style="margin:0 0 6px">Catatan Perubahan Manual</div><div class="note">${esc(c.note)}</div></div>`;
  }else{
    const sec=(title,desc,rows)=>`<div class="box"><h3>${title}</h3><div class="small" style="margin:-6px 0 10px">${desc}</div><table><thead><tr><th>Field</th><th>Dokumen</th><th>Nilai</th><th>Status</th></tr></thead><tbody>`+
      rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td><span class="badge ${r[3]==="m"?"b-ok":r[3]==="x"?"b-bad":"b-na"}">${r[3]==="m"?"Match":r[3]==="x"?"Mismatch":"Not checked"}</span></td></tr>`).join("")+`</tbody></table></div>`;
    const rows=docAll(c),m=rows.filter(r=>r[3]==="m").length,x=rows.filter(r=>r[3]==="x").length,n=rows.length-m-x;
    body=statHead("Document validation",`The same field compared across the documents · ${dp===null?"–":dp+"%"} match`,
      [[m,"Match","s-ok"],[x,"Mismatch","s-bad"],[n,"Not filled","s-na"]],`${m}/${m+x}`,dp)+
      sec("Invoice Freight & Invoice Duty","AWB, no. invoice, subtotal, DPP & PPN antar invoice, faktur pajak & credit note",c.docInv)+
      (c.jalur==="CN"?sec("SPPBMCP","Khusus jalur CN · nilai SPPBMCP vs dokumen terkait",c.sppb):`<div class="box small">SPPBMCP tidak ditampilkan: hanya untuk jalur CN (AWB ini jalur ${c.jalur}).</div>`)+
      sec("NPWP Table","Nama perusahaan dicek terhadap master NPWP",c.npwp);
  }
  return `<div class="detail"><div class="tabs">`+tabs.map(([k,l,p])=>`<button class="${tab===k?"on":""}" data-tab="${k}" data-id="${c.id}">${p!==null||k!=="inv"?`<span class="tdot" style="background:${dotColor(p)}"></span>`:""}${l}</button>`).join("")+
    `<span class="ro">View only</span><button class="pbtn" data-print="${c.id}" aria-label="Print tab ${TABNAME[tab]}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="7"/></svg>Print</button></div>`+
    `<div class="ponly">Finance Handover · Courier · ${TABNAME[tab]} · dicetak ${new Date().toLocaleString("id-ID")}</div>${body}</div>`;
}

function render(){
  renderKpis();
  const q=state.q.toLowerCase();
  const L=data.filter(c=>(state.filter==="all"||c.status===state.filter)&&(!q||[c.awb,c.vendor,c.pt,c.courier,...c.inv.map(i=>i.no)].join(" ").toLowerCase().includes(q)));
  const el=document.getElementById("list");
  if(!L.length){el.innerHTML=`<div class="empty">Tidak ada handover.</div>`;return}
  el.innerHTML=L.map(c=>{
    const st=c.status,open=state.open===c.id,[sl,sc]=STL[st];
    const amtLine=st==="p"?`<div class="due paid">Paid ${c.paid}</div>`:`<div class="due">Due ${c.due} · TOP ${c.top}</div>`;
    const act=(st==="w"?`<button class="btn pri" data-acc="${c.id}">Accept</button>`:st==="r"?`<button class="btn pri" data-paid="${c.id}">Mark paid</button>`:`<span class="status st-p">✓ Paid</span>`)+
      `<button class="btn out ${open?"on":""}" data-open="${c.id}" aria-expanded="${open}">${open?"Close ▴":"Open ▾"}</button>`;
    return `<div class="card ${st==="p"?"paid":""}" data-card="${c.id}"><div class="row">
      <div class="c-left"><span class="chip cour">Courier</span><span class="chip pt">${c.pt}</span><span class="chip ${c.jalur==="CN"?"cn":"pib"}">${c.jalur}</span>
        <div class="lbl">AWB</div><div class="awb">${c.awb}</div><div class="small">${c.inv.length} invoice · ${c.inv.map(i=>i.t.replace("Invoice ","").replace("Credit Note","CN")).join(" + ")}</div></div>
      <div class="c-pay"><div class="lbl">Payable to</div><div class="pay">${c.payable}</div><div class="small">Vendor: ${c.vendor}</div><div style="margin-top:6px"><span class="status ${sc}">${sl}</span></div></div>
      <div class="c-amt"><div class="amt">${rp(total(c))}</div>${amtLine}</div>
      <div class="c-tl"><div class="tl">${tlStep("Sent",c.sent,true,st!=="w")}${tlStep("Received",st!=="w"?c.recv:"",st!=="w",st==="p")}${tlStep("Paid",st==="p"?c.paid:"",st==="p",false)}</div></div>
      <div class="c-act">${act}</div></div>${open?detailHtml(c):""}</div>`}).join("");
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.print){
    const card=document.querySelector(`[data-card="${b.dataset.print}"]`);
    document.body.classList.add("printing");card.classList.add("print-me");
    const done=()=>{document.body.classList.remove("printing");card.classList.remove("print-me")};
    window.addEventListener("afterprint",done,{once:true});
    try{window.print()}catch(err){toast("Print tidak tersedia di preview ini");done()}
  }
  else if(b.dataset.f){state.filter=b.dataset.f;render()}
  else if(b.dataset.open){const id=+b.dataset.open;state.open=state.open===id?null:id;render()}
  else if(b.dataset.tab){state.tab[b.dataset.id]=b.dataset.tab;render()}
  else if(b.dataset.acc){const c=data.find(x=>x.id==b.dataset.acc);c.status="r";c.recv="06 Oct 2026";toast(`${c.awb} diterima (${c.inv.length} invoice)`);render()}
  else if(b.dataset.paid){const c=data.find(x=>x.id==b.dataset.paid);c.status="p";c.paid="06 Oct 2026";toast(`${c.awb} ditandai Paid`);render()}
});
document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value;render()});
render();
</script>
</body>
</html>
